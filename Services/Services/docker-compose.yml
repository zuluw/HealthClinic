services:
  services-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: innoclinic-services-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SERVICES_DB_PASSWORD}
    ports:
      - "1435:1433"
    volumes:
      - services-mssql-data:/var/opt/mssql
    networks: 
      - innoclinic-network

  services-api:
    build:
      context: .
      dockerfile: InnoClinic.Services.Api/Dockerfile
    container_name: innoclinic-services-api
    ports:
      - "8084:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${SERVICES_DB_CONNECTION}
      - RabbitMq__Username=${RABBITMQ_DEFAULT_USER}
      - RabbitMq__Password=${RABBITMQ_DEFAULT_PASS}
      - RabbitMq__Host=rabbitmq
    depends_on:
      - services-db
    networks: 
      - innoclinic-network

volumes:
  services-mssql-data:
networks:
  innoclinic-network:
    external: true